<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Cybozu Days 2026 の非公式観覧アプリ（運営：合同会社Pons）。公式サイトとは関係ありません。正式な情報は公式サイトをご確認ください。">
<meta name="author" content="合同会社Pons">
<title>CD26 観覧アプリ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="appbar" id="appbar">
  <h1 class="appbar-title" id="appbarTitle">タイムテーブル</h1>
  <div class="appbar-actions" id="appbarActions"></div>
  <button type="button" class="icon-btn" id="helpBtn" aria-label="このアプリについて・利用規約" title="このアプリについて・利用規約"><svg class="ic"><use href="#i-help"/></svg></button>
</header>

<main id="main">
  <!-- タイムテーブル -->
  <section class="view" id="view-timetable" data-title="タイムテーブル">
    <div class="subbar">
      <div class="tabs" role="tablist" id="dayTabs"></div>
      <div class="segmented" role="group" aria-label="表示切替">
        <button type="button" data-mode="mine" class="seg">マイ予定</button>
        <button type="button" data-mode="list" class="seg">セッション一覧</button>
      </div>
    </div>
    <div class="view-body" id="ttBody"></div>
  </section>

  <!-- マップ -->
  <section class="view" id="view-map" data-title="会場マップ">
    <div class="map-search">
      <label class="searchbar">
        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="mapSearch" placeholder="企業名・ブース番号・スポットを検索" autocomplete="off">
      </label>
      <ul class="suggest" id="mapSuggest" role="listbox" hidden></ul>
      <div class="chips map-chips" id="mapChips"></div>
    </div>
    <div id="map" aria-label="会場マップ"></div>
    <div class="map-tools">
      <button type="button" class="fab-small" id="mapFit" aria-label="全体を表示"><svg class="ic"><use href="#i-fit"/></svg></button>
      <button type="button" class="fab-small" id="mapList" aria-label="ブース一覧"><svg class="ic"><use href="#i-list"/></svg></button>
    </div>
  </section>

  <!-- メモ -->
  <section class="view" id="view-memo" data-title="メモ">
    <div class="subbar">
      <div class="tabs" role="tablist" id="memoTabs">
        <button type="button" role="tab" data-memo="sessions" class="tab">感想</button>
        <button type="button" role="tab" data-memo="booths" class="tab">ブース</button>
        <button type="button" role="tab" data-memo="contacts" class="tab">連絡先</button>
      </div>
    </div>
    <div class="view-body" id="memoBody"></div>
  </section>

  <!-- バックアップ -->
  <section class="view" id="view-backup" data-title="バックアップ">
    <div class="view-body" id="backupBody"></div>
  </section>
</main>

<button type="button" class="fab" id="fab" hidden><svg class="ic"><use href="#i-add"/></svg><span id="fabLabel"></span></button>

<nav class="navbar" aria-label="メインメニュー">
  <button type="button" class="nav-item" data-view="timetable"><span class="nav-ind"><svg class="ic"><use href="#i-event"/></svg></span><span>予定</span></button>
  <button type="button" class="nav-item" data-view="map"><span class="nav-ind"><svg class="ic"><use href="#i-map"/></svg></span><span>マップ</span></button>
  <button type="button" class="nav-item" data-view="memo"><span class="nav-ind"><svg class="ic"><use href="#i-note"/></svg></span><span>メモ</span></button>
  <button type="button" class="nav-item" data-view="backup"><span class="nav-ind"><svg class="ic"><use href="#i-backup"/></svg></span><span>バックアップ</span></button>
</nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-handle" aria-hidden="true"></div>
  <div class="sheet-content" id="sheetContent"></div>
</dialog>

<div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>
